<svg xmlns="http://www.w3.org/2000/svg" width="620" height="160" viewBox="0 0 620 160" fill="none">
  <style>
    .bignum {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 700;
      fill: #24292f;
    }
    .statnum {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      fill: #24292f;
      text-anchor: end;
    }
    .label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 400;
      fill: #6e7681;
    }
    .statlabel {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 400;
      fill: #6e7681;
      text-anchor: end;
    }
    .sparkline {
      stroke: #6e7681;
      stroke-width: 1.8;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .baseline {
      stroke: #d0d7de;
      stroke-width: 1;
    }
    .dot {
      fill: #ffffff;
      stroke: #24292f;
      stroke-width: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      .bignum, .statnum { fill: #f0f6fc; }
      .label, .statlabel { fill: #8b949e; }
      .sparkline { stroke: #c9d1d9; }
      .baseline { stroke: #30363d; }
      .dot { fill: #ffffff; stroke: #c9d1d9; }
    }
  </style>

  <!-- Big contribution count -->
  <text x="24" y="60" class="bignum">1,020</text>
  <text x="24" y="86" class="label">contributions in the last year</text>

  <!-- Right side stats -->
  <text x="596" y="36" class="statnum">170</text>
  <text x="596" y="52" class="statlabel">active days</text>

  <text x="596" y="82" class="statnum">109</text>
  <text x="596" y="98" class="statlabel">best week</text>

  <!-- Sparkline baseline -->
  <line x1="24" y1="142" x2="596" y2="142" class="baseline"/>

  <!-- Sparkline -->
  <path d="M 24.0 100.0 L 35.0 142.0 L 46.0 137.4 L 57.0 137.0 L 68.0 137.8 L 79.0 139.7 L 90.0 133.9 L 101.0 118.5 L 112.0 125.8 L 123.0 110.8 L 134.0 118.5 L 145.0 128.1 L 156.0 142.0 L 167.0 137.0 L 178.0 128.5 L 189.0 137.8 L 200.0 122.7 L 211.0 137.0 L 222.0 134.7 L 233.0 142.0 L 244.0 135.4 L 255.0 131.2 L 266.0 137.8 L 277.0 137.4 L 288.0 140.5 L 299.0 134.3 L 310.0 120.8 L 321.0 134.7 L 332.0 135.1 L 343.0 134.3 L 354.0 140.1 L 365.0 137.4 L 376.0 129.7 L 387.0 136.2 L 398.0 141.2 L 409.0 142.0 L 420.0 138.9 L 431.0 142.0 L 442.0 140.5 L 453.0 142.0 L 464.0 138.1 L 475.0 140.8 L 486.0 142.0 L 497.0 138.1 L 508.0 136.2 L 519.0 138.9 L 530.0 138.9 L 541.0 124.7 L 552.0 138.5 L 563.0 135.8 L 574.0 140.5 L 585.0 137.8 L 596.0 140.1" class="sparkline" fill="none"/>

