<svg xmlns="http://www.w3.org/2000/svg" width="620" height="160" viewBox="0 0 620 160" fill="none">
  <style>
    .bignum {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 700;
      fill: #24292f;
    }
    .statnum {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      fill: #24292f;
      text-anchor: end;
    }
    .label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 400;
      fill: #6e7681;
    }
    .statlabel {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 400;
      fill: #6e7681;
      text-anchor: end;
    }
    .sparkline {
      stroke: #6e7681;
      stroke-width: 1.8;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .baseline {
      stroke: #d0d7de;
      stroke-width: 1;
    }
    .dot {
      fill: #ffffff;
      stroke: #24292f;
      stroke-width: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      .bignum, .statnum { fill: #f0f6fc; }
      .label, .statlabel { fill: #8b949e; }
      .sparkline { stroke: #c9d1d9; }
      .baseline { stroke: #30363d; }
      .dot { fill: #ffffff; stroke: #c9d1d9; }
    }
  </style>

  <!-- Big contribution count -->
  <text x="24" y="60" class="bignum">1,685</text>
  <text x="24" y="86" class="label">contributions in the last year</text>

  <!-- Right side stats -->
  <text x="596" y="36" class="statnum">178</text>
  <text x="596" y="52" class="statlabel">active days</text>

  <text x="596" y="82" class="statnum">367</text>
  <text x="596" y="98" class="statlabel">best week</text>

  <!-- Sparkline baseline -->
  <line x1="24" y1="142" x2="596" y2="142" class="baseline"/>

