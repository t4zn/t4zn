  <path d="M 24.0 126.4 L 35.0 133.3 L 46.0 100.0 L 57.0 128.0 L 68.0 129.5 L 79.0 142.0 L 90.0 140.6 L 101.0 140.5 L 112.0 140.7 L 123.0 141.3 L 134.0 139.6 L 145.0 135.0 L 156.0 137.2 L 167.0 132.7 L 178.0 135.0 L 189.0 137.9 L 200.0 142.0 L 211.0 140.5 L 222.0 138.0 L 233.0 140.7 L 244.0 136.3 L 255.0 140.5 L 266.0 139.8 L 277.0 142.0 L 288.0 140.1 L 299.0 138.8 L 310.0 140.7 L 321.0 140.6 L 332.0 141.5 L 343.0 139.7 L 354.0 135.7 L 365.0 139.8 L 376.0 139.9 L 387.0 139.7 L 398.0 141.4 L 409.0 140.6 L 420.0 138.3 L 431.0 140.3 L 442.0 141.8 L 453.0 142.0 L 464.0 141.1 L 475.0 142.0 L 486.0 141.5 L 497.0 142.0 L 508.0 140.9 L 519.0 141.7 L 530.0 142.0 L 541.0 140.9 L 552.0 140.3 L 563.0 141.1 L 574.0 141.1 L 585.0 136.9 L 596.0 141.0" class="sparkline" fill="none"/>

