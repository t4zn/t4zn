  <path d="M 24.0 142.0 L 35.0 135.8 L 46.0 135.3 L 57.0 136.3 L 68.0 138.9 L 79.0 131.1 L 90.0 110.4 L 101.0 120.2 L 112.0 100.0 L 123.0 110.4 L 134.0 123.3 L 145.0 142.0 L 156.0 135.3 L 167.0 123.9 L 178.0 136.3 L 189.0 116.1 L 200.0 135.3 L 211.0 132.1 L 222.0 142.0 L 233.0 133.2 L 244.0 127.5 L 255.0 136.3 L 266.0 135.8 L 277.0 139.9 L 288.0 131.6 L 299.0 113.5 L 310.0 132.1 L 321.0 132.7 L 332.0 131.6 L 343.0 139.4 L 354.0 135.8 L 365.0 125.4 L 376.0 134.2 L 387.0 141.0 L 398.0 142.0 L 409.0 137.9 L 420.0 142.0 L 431.0 139.9 L 442.0 142.0 L 453.0 136.8 L 464.0 140.4 L 475.0 142.0 L 486.0 136.8 L 497.0 134.2 L 508.0 137.9 L 519.0 137.9 L 530.0 118.7 L 541.0 137.3 L 552.0 133.7 L 563.0 139.9 L 574.0 136.3 L 585.0 133.7 L 596.0 142.0" class="sparkline" fill="none"/>

